# Fork-specific: weekly rebuild and vulnerability scan.
#
# Not inherited from linuxserver/docker-wireguard. The point is to stop the
# maintainer being the detection mechanism: CVEs in the Go toolchain and in
# Alpine packages land between releases, and this surfaces them within a week
# instead of whenever someone happens to look at Docker Desktop.
#
# Scans only. Never pushes an image. Publishing stays a deliberate local act
# via scripts/release.sh.
#
# Requires two repository secrets for Docker Scout authentication:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN  (a read-only access token is enough)
#
# Note: the schedule only fires from this repository's default branch, which
# for this fork is security-patches.
name: Weekly security scan

on:
  schedule:
    # 07:15 UTC every Monday
    - cron: '15 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  rebuild-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image from current pins
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          no-cache: true
          pull: true
          tags: wireguard-scan-candidate:latest

      - name: Log in to Docker Hub for Scout
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Publishes the findings to the run summary and fails the step when
      # anything fixable at these severities is present. Unfixable advisories
      # are excluded by only-fixed, so permanent ones never gate the job.
      # The input is only-severities, plural, unlike the CLI's --only-severity.
      - name: Scan for fixable critical and high findings
        id: scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: wireguard-scan-candidate:latest
          platform: linux/amd64
          only-fixed: true
          only-severities: critical,high
          exit-code: true
          summary: true
          write-comment: false

      # Context for the maintainer: the full picture including the unfixable
      # advisories, so the summary shows what was excluded above.
      - name: Record the full picture in the run summary
        if: always()
        uses: docker/scout-action@v1
        with:
          command: cves
          image: wireguard-scan-candidate:latest
          platform: linux/amd64
          summary: true
          write-comment: false

      - name: Open an issue when something is fixable
        if: failure() && steps.scout.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The weekly rebuild found vulnerabilities that have a fix available."
            echo
            echo "Findings are in the [run summary]($RUN_URL). Published \`latest\` carries"
            echo "the same pins as this build, so assume it is affected too."
            echo
            echo "Next steps:"
            echo
            echo '1. `scripts/check-versions.sh` to find the fixed versions.'
            echo '2. Bump pins in **both** Dockerfiles, or just rebuild if the fix is an apk package.'
            echo '3. `scripts/release.sh --no-push`, then `scripts/release.sh`.'
            echo '4. Changelog entry in `readme-vars.yml`, refresh `overview.md`, commit and push.'
            echo
            echo "_Opened automatically by \`.github/workflows/security-scan.yml\`._"
          } > issue-body.md

          title="Fixable vulnerabilities found in weekly scan ($(date -u +%Y-%m-%d))"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'Fixable vulnerabilities found in weekly scan in:title' \
            --json number --jq '.[0].number' 2>/dev/null || true)"

          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file issue-body.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file issue-body.md
          fi
